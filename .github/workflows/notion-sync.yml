name: Sync PlantUML To Notion

on:

  push:

    paths:

      - "docs/topology.plantuml"

jobs:

  sync:

    runs-on: ubuntu-latest


    steps:

      - uses: actions/checkout@v4

      - name: test notion api
        run: |
          curl \
            -H "Authorization: Bearer ${{ secrets.NOTION_TOKEN}}" \
            -H "Notion-Version: 2022-06-28" \
            https://api.notion.com/v1/pages/${{ secrets.NOTION_PAGE_ID }}
